[package]
name = "shiki"
version = "0.3.0"
edition = "2021"

[dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
open = "5.4.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_Shutdown", "Win32_System_Com", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Memory", "Win32_UI_Accessibility", "Devices_Radios", "Media_Control", "Foundation", "Storage_Streams"] }
xcap = "0.9.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = "2"
