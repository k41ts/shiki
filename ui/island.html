<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    interpolate-size: allow-keywords;
    --bg: #0a0a0d;
    --card: #15161c;
    --card-2: #1c1d25;
    --line: rgba(255, 255, 255, 0.07);
    --text: #f2f3f7;
    --muted: #8b90a3;
    --accent: #e2b65a;
    --accent-ink: #1c1405;
    --danger: #ff6b6b;
    --soul: #ffb43a;
    --eye: #d9a33a;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.36, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input { font: inherit; color: inherit; }
  svg { display: block; }

  /* ---------- island shell ---------- */
  #island {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: var(--bg);
    border: 1px solid rgba(255, 255, 255, 0.06); border-top: 0;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    overflow: hidden;
    width: 132px; height: 34px; border-radius: 0 0 18px 18px;
    transition: width 420ms var(--spring), height 420ms var(--spring), border-radius 300ms var(--ease-out), opacity 200ms ease, transform 200ms ease;
  }
  #island.idle:hover { width: 148px; height: 36px; }
  #island.active { width: max-content; height: auto; max-width: min(560px, calc(100vw - 16px)); border-radius: 0 0 22px 22px; }
  #island.open { width: min(760px, calc(100vw - 16px)); height: min(var(--h, 480px), calc(100vh - 8px)); border-radius: 0 0 26px 26px; }
  /* each tab gets the height it needs, like Hitodama */
  #island[data-tab="controls"] { --h: 392px; }
  #island[data-tab="today"] { --h: 352px; }
  #island[data-tab="stats"] { --h: 290px; }
  #island[data-tab="clipboard"] { --h: 440px; }
  #island[data-tab="apps"] { --h: 450px; }
  #island[data-tab="wallpaper"] { --h: 268px; }
  #island[data-tab="power"] { --h: 210px; }
  /* mini player in the collapsed notch while music plays */
  #island.idle.music { width: max-content; max-width: 380px; }
  #island.idle.music .notch { justify-content: flex-start; }
  .mini { display: none; align-items: center; gap: 8px; min-width: 0; padding-top: 1px; }
  #island.idle.music .mini { display: flex; }
  .mini .mart { width: 20px; height: 20px; border-radius: 5px; background: var(--card-2) center / cover; flex: none; }
  .mini .mtitle { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
  .eq { display: flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
  .eq i { width: 2px; border-radius: 1px; background: var(--accent); animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  #island.hidden { opacity: 0; transform: translate(-50%, -100%); pointer-events: none; }

  .notch { display: flex; align-items: flex-start; gap: 10px; padding: 6px 16px 7px; min-height: 34px; cursor: pointer; }
  #island.idle .notch { justify-content: center; }
  #island.open .notch { display: none; }
  .activity { display: none; align-items: flex-start; gap: 10px; padding-top: 1px; min-width: 0; }
  #island.active .activity { display: flex; }
  .activity .text {
    font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
    animation: fade-in 260ms var(--ease-out) 160ms both; /* after the notch has mostly grown */
  }
  [data-state="listening"] .activity .text, [data-state="thinking"] .activity .text { color: var(--muted); }
  [data-state="thinking"] .activity .text {
    background: linear-gradient(90deg, var(--muted) 30%, #fff 50%, var(--muted) 70%) 0 0 / 220% 100%;
    -webkit-background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { to { background-position: -220% 0; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(-3px); } }

  .bars { display: none; align-items: center; gap: 3px; height: 20px; }
  [data-state="listening"] .bars { display: flex; }
  .bars i { width: 3px; height: 4px; border-radius: 2px; background: var(--soul); transition: height 90ms ease-out; }

  /* ---------- Shiki's mask: states ---------- */
  /* masks.js draws the mask and its idle colours; the island's state recolours eyes and aura. */
  [data-state="listening"] { --soul: #ffd23a; --eye: #ffe36b; }
  [data-state="listening"] .soul .eyes { animation: none; }
  [data-state="thinking"] { --soul: #a86bff; --eye: #d29bff; }
  [data-state="thinking"] .soul .body { animation: menace 1.1s ease-in-out infinite; }
  [data-state="done"] { --soul: #4dffa0; --eye: #8dffc4; }
  [data-state="error"] { --soul: #ff1a2e; --eye: #ff4a4a; }
  @keyframes menace { 25% { transform: rotate(-4deg) scale(1.03); } 75% { transform: rotate(4deg) scale(1.03); } }
  /* while Shiki talks back, its eyes pulse */
  #island.speaking .soul .glow { animation: speak-pulse 0.5s ease-in-out infinite alternate; }
  @keyframes speak-pulse { to { filter: drop-shadow(0 0 2.5px var(--eye)) brightness(1.5); } }
  .soul.big { width: 64px; height: 64px; }

  /* ---------- panel ---------- */
  .panel { display: none; flex-direction: column; height: 100%; }
  #island.open .panel { display: flex; animation: panel-in 360ms var(--ease-out) both; }
  @keyframes panel-in { from { opacity: 0; } }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px 18px; }
  nav { display: flex; gap: 2px; flex: 1; justify-content: center; }
  nav button { padding: 5px 11px; border-radius: 999px; color: var(--muted); font-size: 12.5px; font-weight: 500; transition: background 160ms, color 160ms; }
  nav button:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
  nav button.on { color: var(--accent-ink); background: var(--accent); }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background 160ms, color 160ms, transform 120ms; }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
  .icon-btn:active, .btn:active, .tile:active { transform: scale(0.95); }

  main { flex: 1; min-height: 0; padding: 4px 18px 18px; }
  section { display: none; height: 100%; }
  section.on { display: flex; flex-direction: column; animation: fade-in 240ms var(--ease-out) both; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .muted { color: var(--muted); }
  .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .btn { padding: 7px 12px; border-radius: 10px; background: var(--card-2); font-weight: 500; transition: background 160ms, transform 120ms; }
  .btn:hover { background: #262833; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .field { width: 100%; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); outline: none; transition: border-color 160ms; }
  .field:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #2a2c36 transparent; }
  .empty { display: grid; place-items: center; gap: 6px; text-align: center; color: var(--muted); padding: 30px 0; }

  /* chat */
  .chat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #messages { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; animation: fade-in 220ms var(--ease-out) both; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
  .msg.assistant { align-self: flex-start; background: var(--card-2); border-bottom-left-radius: 6px; }
  .msg.error { align-self: flex-start; background: rgba(255, 107, 107, 0.12); color: #ffb3b3; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; animation: fade-in 220ms var(--ease-out) both; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; background: var(--card-2); border-radius: 16px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dot 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 30% { transform: translateY(-4px); opacity: 1; } 0%, 60%, 100% { opacity: 0.4; } }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .suggest button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); transition: background 160ms, border-color 160ms; }
  .suggest button:hover { background: var(--card-2); border-color: rgba(255, 255, 255, 0.14); }
  .composer { display: flex; gap: 8px; }
  .composer .btn { width: 40px; display: grid; place-items: center; padding: 0; border-radius: 12px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-align: center; }

  /* controls */
  .ctl-grid { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .togs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tog { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 14px; background: var(--card-2); text-align: left; min-width: 0;
    transition: background 200ms, color 200ms, transform 120ms; }
  .tog:active { transform: scale(0.97); }
  .tog .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); flex: none; transition: background 200ms; }
  .tog b { display: block; font-size: 12.5px; font-weight: 600; }
  .tog small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tog.on { background: var(--accent); color: var(--accent-ink); }
  .tog.on small { color: color-mix(in srgb, var(--accent-ink) 70%, transparent); }
  .tog.on .ic { background: rgba(0, 0, 0, 0.12); }
  .tog.na { opacity: 0.4; pointer-events: none; }
  .slider-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--card-2); }
  .slider-row span { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); width: 38px; text-align: right; }
  input[type=range].slider { flex: 1; appearance: none; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
    background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 50%) 100% no-repeat, #2a2c36; }
  input[type=range].slider::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); }
  .player { display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card-2); min-width: 0; }
  .now { display: flex; gap: 14px; align-items: center; }
  .art { width: 72px; height: 72px; border-radius: 12px; flex: none; background: #22232c center / cover; display: grid; place-items: center; color: var(--muted); }
  .player .meta { min-width: 0; flex: 1; }
  .player .title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .artist { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transport { display: flex; gap: 6px; flex: none; }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; position: relative; }
  .progress::before { content: ""; flex: 1; height: 4px; border-radius: 2px; background: #2f313c; }
  .progress i { position: absolute; left: 0; height: 4px; border-radius: 2px; background: var(--text); transition: width 1.5s linear; }
  .progress:hover i { background: var(--accent); }
  .progress.off { cursor: default; opacity: 0.4; }
  .transport .icon-btn { width: 36px; height: 36px; color: var(--text); background: rgba(255, 255, 255, 0.06); }
  .transport .play { background: var(--text); color: var(--bg); }
  .transport .play:hover { background: #fff; color: var(--bg); }
  .quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .tile { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: var(--card-2); font-size: 11.5px; transition: background 160ms, transform 120ms; text-align: center; }
  .tile:hover { background: #262833; }
  .tile svg { color: var(--accent); }

  /* today */
  .today-grid { display: grid; grid-template-columns: 120px minmax(0, 1.35fr) minmax(0, 1fr); gap: 10px; height: 100%; }
  .today-grid > * { min-width: 0; }
  .bigclock { display: grid; place-content: center; justify-items: center; gap: 2px; text-align: center; }
  .bigclock b { font: 600 46px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .bigclock .dots { color: var(--accent); letter-spacing: 3px; font-size: 10px; line-height: 1; }
  .bigclock small { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .midcol { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .week-head b { font-size: 13px; } .week-head span { color: var(--muted); font-size: 11.5px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .week div { padding: 5px 0; border-radius: 9px; font-size: 11px; color: var(--muted); }
  .week div b { display: block; font-size: 14px; color: var(--text); font-weight: 600; margin-top: 1px; }
  .week div.today { background: var(--accent); color: var(--accent-ink); }
  .week div.today b { color: var(--accent-ink); }
  .next { margin-top: 10px; padding: 7px 10px; border-left: 3px solid var(--accent); border-radius: 6px; background: rgba(255, 255, 255, 0.04); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next small { color: var(--muted); display: block; font-size: 11px; }
  .pomo { display: flex; gap: 14px; align-items: center; }
  .pring { --v: 100; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: radial-gradient(closest-side, var(--card) 84%, transparent 85% 100%), conic-gradient(var(--accent) calc(var(--v) * 1%), #2f313c 0); }
  .pring b { font: 600 20px "Segoe UI Variable Display", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .pomo-side { flex: 1; min-width: 0; display: grid; gap: 8px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chips button { padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); background: rgba(255, 255, 255, 0.05); transition: background 160ms, color 160ms; }
  .chips button.on { background: var(--accent); color: var(--accent-ink); }
  .pomo-btns { display: flex; gap: 6px; } .pomo-btns .btn { flex: 1; padding: 6px 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  li.row:last-child { border-bottom: 0; }
  li.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li.row small { display: block; color: var(--muted); font-size: 11.5px; }
  .check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; transition: border-color 160ms, background 160ms; }
  .check:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .x { color: var(--muted); padding: 2px 6px; border-radius: 6px; } .x:hover { color: var(--danger); }
  .todo-add { display: flex; gap: 6px; margin-top: 6px; }
  .todo-add input { padding: 7px 11px; font-size: 12.5px; }
  .todo-add .btn { width: 34px; padding: 0; display: grid; place-items: center; }

  /* stats */
  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 100%; }
  .gauges .gauge { align-content: center; }
  .gauge { display: grid; justify-items: center; gap: 10px; padding: 22px 10px; }
  .ring { --v: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(closest-side, var(--card) 79%, transparent 80% 100%), conic-gradient(var(--accent) calc(var(--v) * 1%), #262833 0);
    transition: --v 600ms var(--ease-out); }
  .ring b { font: 600 24px "Segoe UI Variable Display", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  @property --v { syntax: "<number>"; inherits: false; initial-value: 0; }

  /* clipboard */
  .clip-top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .clip-top .field { flex: 1; padding: 8px 12px; }
  .clip-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
  .clip-list { display: flex; flex-direction: column; gap: 4px; }
  .clip { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 8px 10px; border-radius: 10px; transition: background 140ms; }
  .clip:hover { background: var(--card-2); }
  .clip.sel { background: color-mix(in srgb, var(--accent) 18%, var(--card-2)); }
  .clip .kind { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); color: var(--muted); flex: none; font-size: 11px; }
  .clip span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip-preview { display: flex; flex-direction: column; min-height: 0; }
  .clip-preview pre { flex: 1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; font: 12.5px/1.5 "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: text; }
  .clip-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 11.5px; color: var(--muted); margin: 10px 0; }
  .clip-meta b { color: var(--text); font-weight: 500; }
  .clip-actions { display: flex; gap: 6px; } .clip-actions .btn { flex: 1; }

  /* apps */
  .apps { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .sect { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 10px 8px 4px; }
  .sect:first-child { margin-top: 2px; }
  .arow { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: 10px; text-align: left; transition: background 140ms; }
  .arow:hover, .arow.first { background: var(--card-2); }
  .arow .icon, .arow .mono { width: 28px; height: 28px; flex: none; }
  .arow .icon { object-fit: contain; animation: fade-in 200ms var(--ease-out) both; }
  .arow .mono { border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0b0b10; }
  .arow .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .arow .type { color: var(--muted); font-size: 11.5px; }
  .star { color: #4a4d5a; padding: 2px 4px; border-radius: 6px; transition: color 160ms, transform 160ms; }
  .star:hover { color: var(--muted); transform: scale(1.15); }
  .star.on { color: var(--accent); }

  /* wallpaper: slanted strip, the selected card opens wide */
  .wall-bar { display: flex; align-items: center; gap: 10px; }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  .seg button { padding: 3px 12px; border-radius: 999px; color: var(--muted); font-size: 12px; font-weight: 500; transition: background 160ms, color 160ms; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .wall-count { flex: 1; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; }
  .strip { display: flex; gap: 10px; align-items: center; transition: transform 560ms var(--spring); will-change: transform; }
  .wcard { flex: none; position: relative; height: 128px; width: 34px; border-radius: 12px; overflow: hidden; transform: skewX(-12deg);
    background: var(--card-2); filter: brightness(0.62) saturate(0.85); cursor: pointer;
    transition: width 560ms var(--spring), filter 320ms ease, box-shadow 320ms ease; }
  .wcard i { position: absolute; inset: 0 -40px; background: center / cover; transform: skewX(12deg); }
  .wcard.near { width: 62px; filter: brightness(0.78); }
  .wcard.active { width: 232px; filter: none; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55); }
  .wcard:hover:not(.active) { filter: brightness(0.95); }
  .wcard.current::after { content: ""; position: absolute; top: 9px; right: 14px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .wcard.apply { animation: wcard-apply 700ms var(--ease-out); }
  @keyframes wcard-apply { 40% { transform: skewX(-12deg) scale(1.06); filter: brightness(1.3); } }
  .wall-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; }
  .wall-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wall-hint { color: var(--muted); white-space: nowrap; }

  /* power */
  .power { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px; }
  .power .tile { padding: 22px 6px; font-size: 13px; }
  .power .tile.danger svg { color: var(--danger); }
  .power .tile.confirm { background: rgba(255, 107, 107, 0.16); color: #ffc2c2; }

  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 8px); opacity: 0; padding: 6px 14px; border-radius: 999px;
    background: var(--text); color: var(--bg); font-weight: 600; font-size: 12.5px; transition: opacity 180ms, transform 240ms var(--spring); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>

<script src="masks.js"></script>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = id => document.getElementById(id);
  const island = $('island');

  // Shiki's mask comes from masks.js; which one is chosen in the Loadout.
  let mask = 'hannya';
  function soulSvg(big) { return maskSvg(mask, big); }
  function setMask(m) {
    mask = m || 'hannya';
    applyMaskColours(mask);
    document.querySelectorAll('svg.soul').forEach(svg => { svg.outerHTML = soulSvg(svg.classList.contains('big')); });
  }
  document.querySelectorAll('.soul-slot').forEach(s => s.outerHTML = soulSvg(false));
  invoke('get_config').then(cfg => setMask(cfg.mask));
  listen('config-changed', ({ payload: cfg }) => setMask(cfg.mask));

  // Shiki watches the cursor anywhere on screen. Rust sends its position (relative to this window)
  // only when it moves.
  listen('cursor', ({ payload: [x, y] }) => lookAt(x / devicePixelRatio, y / devicePixelRatio));

  // Spoken replies (Loadout › Voice). The eyes pulse while it talks.
  let voice = null;
  listen('speak', ({ payload: src }) => {
    voice?.pause();
    voice = new Audio(src);
    island.classList.add('speaking');
    const done = () => island.classList.remove('speaking');
    voice.onended = done; voice.onerror = done;
    voice.play().catch(done);
  });

  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c != null) el.append(c);
    return el;
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1700);
  }

  // ---------- modes: idle / active (status text) / open (panel) ----------
  let mode = 'idle', fullscreen = false, activityTimer, leaveTimer;

  function setMode(m) {
    mode = m;
    island.classList.remove('idle', 'active', 'open');
    island.classList.add(m);
    island.classList.toggle('hidden', fullscreen && m === 'idle');
    if (m !== 'active') island.dataset.state = 'idle';
    reportSoon();
  }

  function openPanel(tab) {
    clearTimeout(activityTimer);
    setMode('open');
    if (tab) showTab(tab); else onTabShown(currentTab);
  }

  function closePanel() {
    if (mode !== 'open') return;
    setMode('idle');
    stopPolling();
    if (document.hasFocus()) invoke('restore_focus');
  }

  // Tell Rust which part of the window should catch the mouse; the rest stays click-through.
  let reportQueued = false;
  function report() {
    reportQueued = false;
    const r = island.getBoundingClientRect(), dpr = devicePixelRatio, pad = 6;
    const rect = island.classList.contains('hidden') ? [0, 0, 0, 0]
      : [(r.left - pad) * dpr, 0, (r.width + pad * 2) * dpr, (r.bottom + pad) * dpr];
    invoke('set_hit_rect', { rect });
  }
  function reportSoon() { if (!reportQueued) { reportQueued = true; requestAnimationFrame(report); } }
  new ResizeObserver(reportSoon).observe(island);
  island.addEventListener('transitionend', reportSoon);

  $('notch').addEventListener('click', () => openPanel(mode === 'active' ? 'chat' : island.classList.contains('music') ? 'controls' : null));
  island.addEventListener('wheel', e => {
    if (mode !== 'open' && e.deltaY > 0) openPanel();
    else if (mode === 'open' && e.deltaY < 0 && e.target.closest('header')) closePanel();
  }, { passive: true });
  island.addEventListener('mouseenter', () => clearTimeout(leaveTimer));
  island.addEventListener('mouseleave', () => {
    if (mode !== 'open') return;
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      const typing = document.activeElement?.tagName === 'INPUT' && document.activeElement.value;
      if (!typing) closePanel();
    }, 700);
  });
  addEventListener('blur', () => { if (mode === 'open' && !picking) { setMode('idle'); stopPolling(); } });
  addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
  $('close-btn').onclick = closePanel;
  $('settings-btn').onclick = () => { closePanel(); invoke('show_settings'); };

  // ---------- status from the backend (voice, replies, errors) ----------
  const bars = [...document.querySelectorAll('#bars i')];
  const shape = [0.55, 0.85, 1, 0.8, 0.6];

  listen('island', ({ payload: { state, text } }) => showActivity(state, text));
  function showActivity(state, text) {
    clearTimeout(activityTimer);
    if (mode === 'open' && state !== 'listening') return; // the chat already shows it
    if (state === 'hide') return setMode('idle');
    if (mode === 'open') setMode('idle');
    island.dataset.state = state;
    $('activity-text').textContent = text;
    setMode('active');
    island.dataset.state = state;
    if (state === 'done' || state === 'error') {
      const secs = Math.max(state === 'error' ? 6 : 4, text.length / 14);
      activityTimer = setTimeout(() => setMode('idle'), secs * 1000);
    }
  }
  listen('level', ({ payload: level }) => {
    const v = Math.min(1, level * 9);
    bars.forEach((b, i) => { b.style.height = `${4 + v * 15 * shape[i] * (0.75 + Math.random() * 0.5)}px`; });
  });
  listen('fullscreen', ({ payload }) => { fullscreen = payload; setMode(mode); });

  // ---------- tabs ----------
  let currentTab = 'chat';
  island.dataset.tab = 'chat';
  function showTab(name) {
    currentTab = name;
    island.dataset.tab = name;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === `tab-${name}`));
    stopPolling();
    onTabShown(name);
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

  let pollTimer;
  function poll(fn, ms) { fn(); pollTimer = setInterval(fn, ms); }
  function stopPolling() { clearInterval(pollTimer); }

  function onTabShown(name) {
    ({
      chat: () => setTimeout(() => $('chat-input').focus(), 50),
      controls: () => { let n = 0; poll(() => { refreshMedia(); if (n++ % 3 === 0) refreshControls(); }, 1500); },
      today: () => { poll(tickClock, 1000); refreshToday(); },
      stats: () => poll(refreshStats, 1000),
      clipboard: refreshClips,
      apps: loadApps,
      wallpaper: loadWalls,
    })[name]?.();
  }

  // ---------- chat ----------
  const messages = $('messages');
  const toolLabel = {
    open_app: a => `Membuka ${a.name}`,
    search: a => `Mencari "${a.query}"${a.site ? ` di ${a.site}` : ''}`,
    media_seek: a => a.mode === 'forward' ? `Maju ${a.seconds} detik` : a.mode === 'back' ? `Mundur ${a.seconds} detik` : `Lompat ke ${Math.floor(a.seconds / 60)}:${String(Math.round(a.seconds % 60)).padStart(2, '0')}`,
    media_control: a => ({ play: 'Memutar', pause: 'Menjeda', next: 'Lagu berikutnya', previous: 'Lagu sebelumnya' })[a.action] || 'Play/pause',
    now_playing: () => 'Melihat yang sedang diputar',
    find_files: a => `Mencari file "${a.query}"`,
    whatsapp_prepare: a => `Menyiapkan ${(a.file || '').split(/[\\/]/).pop()} untuk ${a.contact}`,
    whatsapp_send: () => 'Mengirim di WhatsApp',
    whatsapp_cancel: () => 'Membatalkan kiriman',
    play_youtube: a => `Memutar "${a.query}" di YouTube`,
    open_website: a => `Membuka ${a.url}`,
    press_keys: a => `Menekan ${a.keys}`,

  // Pomodoro: keeps running when the panel closes, and Shiki announces the end in the notch.
  const pomo = { total: 25 * 60, left: 25 * 60, timer: 0 };
  function paintPomo() {
    $('pomo-time').textContent = `${pad(Math.floor(pomo.left / 60))}:${pad(pomo.left % 60)}`;
    $('pomo-ring').style.setProperty('--v', pomo.left / pomo.total * 100);
    $('pomo-start').textContent = pomo.timer ? 'Jeda' : pomo.left < pomo.total ? 'Lanjut' : 'Mulai';
  }
  function chime() {
    try {
      const ctx = new AudioContext();
      [0, 0.18, 0.36].forEach((t, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = [880, 1175, 1568][i];
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.5);
        o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.55);
      });
    } catch {}
  }
  $('pomo-start').onclick = () => {
    if (pomo.timer) { clearInterval(pomo.timer); pomo.timer = 0; return paintPomo(); }
    if (pomo.left <= 0) pomo.left = pomo.total;
    pomo.timer = setInterval(() => {
      pomo.left--;
      if (pomo.left <= 0) {
        clearInterval(pomo.timer); pomo.timer = 0; pomo.left = 0;
        chime();
        showActivity('done', 'Waktu fokus selesai. Istirahat dulu sebentar ✨');
      }
      paintPomo();
    }, 1000);
    paintPomo();
  };
  $('pomo-reset').onclick = () => { clearInterval(pomo.timer); pomo.timer = 0; pomo.left = pomo.total; paintPomo(); };
  document.querySelectorAll('#pomo-chips button').forEach(b => b.onclick = () => {
    clearInterval(pomo.timer); pomo.timer = 0;

    document.querySelectorAll('#pomo-chips button').forEach(x => x.classList.toggle('on', x === b));

  });
  paintPomo();

  // ---------- apps ----------
  let appNames = null, favs = [], usage = {};
  const appIcons = new Map(), iconAsked = new Set();
  function hue(s) { let x = 0; for (const c of s) x = (x * 31 + c.codePointAt(0)) % 360; return x; }
  function appBadge(n) {

    return h('button', { class: `arow${first ? ' first' : ''}`, title: n, onclick: () => { closePanel(); invoke('launch_app', { name: n }); } },

  function renderApps() {
    if (appNames == null) return $('apps').replaceChildren(h('div', { class: 'empty' }, 'Memuat aplikasi…'));
    const q = $('app-search').value.trim().toLowerCase();
    let sections;
    if (q) {

    } else {
      const fav = favs.filter(n => appNames.includes(n));

      const rest = appNames.filter(n => !fav.includes(n) && !recent.includes(n)).sort((a, b) => a.localeCompare(b)).slice(0, 80);
      sections = [['Favorit', fav], ['Terbaru', recent], ['Aplikasi', rest]];
    }
    const shown = [];
    const nodes = [];
    for (const [title, names] of sections) {
      if (!names.length) continue;
      nodes.push(h('div', { class: 'sect' }, title));

  let wallSource = 'recent', walls = [], wallIndex = 0, wallsFor = null, lastWheel = 0, picking = false;

  async function loadWalls(force) {
    if (!force && wallsFor === wallSource) return layoutWalls();
    const empty = text => h('div', { class: 'empty', style: 'position:absolute;inset:0' }, text);
    $('walls').replaceChildren(empty('Menyiapkan thumbnail…'));
    $('wall-name').textContent = $('wall-hint').textContent = '';
    const source = wallSource;
    const [folder, list] = await invoke('wallpapers', { source });
    if (source !== wallSource) return; // switched tabs meanwhile
    walls = list; wallsFor = source;
    wallIndex = Math.max(0, walls.findIndex(w => w.current));
    $('wall-count').textContent = `${walls.length} gambar` + (source === 'folder' ? ` · ${folder.split(/[\\/]/).pop()}` : '');
    $('wall-count').title = source === 'folder' ? folder : '';
    if (!walls.length) {
      $('walls').replaceChildren(empty(source === 'folder' ? 'Tidak ada gambar di folder ini. Pilih folder lain lewat ikon folder.' : 'Belum ada wallpaper.'));
      return layoutWalls();
    }
    const strip = h('div', { class: 'strip', id: 'strip' }, ...walls.map((w, i) => {
      const el = h('div', { class: `wcard${w.current ? ' current' : ''}`, title: w.path }, h('i', { style: `background-image:url("${w.thumb}")` }));
      el.onclick = () => (i === wallIndex ? applyWall(i) : (wallIndex = i, layoutWalls()));
      return el;
    }));
    $('walls').replaceChildren(strip);
    layoutWalls();
  }

  // Slanted strip: the selected card opens wide, its neighbours a little, the rest stay slivers.
  // The strip slides so the selected card sits in the middle (widths are known, so no measuring mid-animation).
  const W_ACTIVE = 232, W_NEAR = 62, W_FAR = 34, GAP = 10;
  function layoutWalls() {
    const cards = [...$('walls').querySelectorAll('.wcard')];
    let x = 0, centre = 0;
    cards.forEach((el, i) => {
      const a = Math.abs(i - wallIndex);
      el.classList.toggle('active', a === 0);
      el.classList.toggle('near', a === 1);
      const w = a === 0 ? W_ACTIVE : a === 1 ? W_NEAR : W_FAR;
      if (a === 0) centre = x + w / 2;
      x += w + GAP;
    });
    const strip = $('strip');
    if (strip) strip.style.transform = `translateX(${$('walls').clientWidth / 2 - centre}px)`;
    const w = walls[wallIndex];
    $('wall-name').textContent = w ? w.name : '';
    $('wall-hint').textContent = !w ? '' : w.current ? 'Terpasang' : 'Klik untuk memasang · scroll untuk geser';
  }

  function moveWall(dir) {
    wallIndex = Math.min(walls.length - 1, Math.max(0, wallIndex + dir));
    layoutWalls();
  }

  async function applyWall(i) {
    const el = $('walls').querySelectorAll('.wcard')[i], w = walls[i];
    el.classList.remove('apply'); void el.offsetWidth; el.classList.add('apply');
    $('wall-hint').textContent = 'Memasang…';
    if (await invoke('set_wallpaper', { path: w.path })) {
      walls.forEach(x => (x.current = x === w));
      $('walls').querySelectorAll('.wcard').forEach((x, j) => x.classList.toggle('current', j === i));
      layoutWalls();
      toast('Wallpaper diganti');
      if (wallSource === 'recent') wallsFor = null; // the recent list's order changed
    } else toast('Gagal mengganti wallpaper');
  }

  $('walls').addEventListener('wheel', e => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastWheel < 140) return;
    lastWheel = now;
    moveWall((Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) > 0 ? 1 : -1);
  }, { passive: false });
  addEventListener('keydown', e => {
    if (mode !== 'open' || currentTab !== 'wallpaper' || !walls.length) return;
    if (e.key === 'ArrowRight') moveWall(1);
    else if (e.key === 'ArrowLeft') moveWall(-1);
    else if (e.key === 'Enter') applyWall(wallIndex);
  });
  function setWallSource(src) {
    wallSource = src;
    document.querySelectorAll('#wall-seg button').forEach(b => b.classList.toggle('on', b.dataset.src === src));
  }
  document.querySelectorAll('#wall-seg button').forEach(b => b.onclick = () => { setWallSource(b.dataset.src); loadWalls(); });
  $('wall-folder').onclick = async () => {
    picking = true; // the folder dialog takes focus; don't let that close the panel
    try {
      if (await invoke('pick_wallpaper_folder')) { setWallSource('folder'); loadWalls(true); }
    } finally { picking = false; }
  };

  // ---------- power ----------
  document.querySelectorAll('[data-power]').forEach(b => {
    const label = b.lastChild.textContent;
    b.onclick = () => {
      if (b.hasAttribute('data-confirm') && !b.classList.contains('confirm')) {
        b.classList.add('confirm'); b.lastChild.textContent = 'Klik lagi';
        setTimeout(() => { b.classList.remove('confirm'); b.lastChild.textContent = label; }, 3000);
        return;
      }
      closePanel();
      invoke('power', { action: b.dataset.power });
    };
  });

  setMode('idle');
</script>
</body>
</html>
